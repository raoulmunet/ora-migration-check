[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="ora-migration-check"
version="0.1.0"
description="Flag Oracle SQL constructs that need attention during migration."
readme="README.md"
requires-python=">=3.10"
license={text="MIT"}
authors=[{name="Raoul Munet"}]
dependencies=[]
[project.optional-dependencies]
dev=["pytest>=8"]
[project.scripts]
ora-migration-check="ora_migration_check.cli:main"
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
